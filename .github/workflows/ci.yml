name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CHELIS_TAG: v0.18.13
  CHELIS_VERSION: 0.18.13

jobs:
  gate:
    runs-on: ubuntu-latest
    # Chelis-Lang/chelis is private: CHELIS_RELEASE_TOKEN is a token with
    # contents: read on it, which installs the release toolchain.
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `conform bump-check --base origin/main` can resolve
          # the base pin. The default shallow clone does not fetch origin/main,
          # which would make the pin-bump guard fail closed.
          fetch-depth: 0
      - name: Bootstrap chelisup
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$CHELIS_TAG" --repo Chelis-Lang/chelis --pattern chelisup.sh --output - | sh
          echo "$HOME/.chelis/bin" >> "$GITHUB_PATH"
      - name: Install chelis toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelisup install 0.18.13
      - name: Conformance audit
        run: chelis reef conform audit
      - name: Pin-bump guard
        run: chelis reef conform bump-check --base origin/main
      - name: Format and lint
        run: |
          set -euo pipefail
          for f in src/*.ch src/published/*.ch testsupport/*.ch demos/*.ch tests/*.ch tests_neg/*/*.ch; do
            chelis fmt --check "$f"
          done
          chelis lint --check src/ testsupport/ demos/ tests/ tests_neg/
      - name: Calendar tests
        run: chelis test tests/
      - name: Negative tests
        run: chelis test tests_neg/ --expect neg
      - name: Evaluator and compiled C agree
        run: |
          set -euo pipefail
          chelis eval --file demos/digest.ch > "$RUNNER_TEMP/eval.txt"
          chelis build demos/digest.ch -o "$RUNNER_TEMP/digest"
          "$RUNNER_TEMP/digest/digest" > "$RUNNER_TEMP/c.txt"
          diff "$RUNNER_TEMP/eval.txt" "$RUNNER_TEMP/c.txt"
      - uses: astral-sh/setup-uv@v6
      - name: Sync generator tests
        working-directory: sync
        run: uv run --frozen --python 3.11 pytest -q
      - name: Generated modules match the pinned snapshots
        working-directory: sync
        run: uv run --frozen --python 3.11 python -m tides_sync check
