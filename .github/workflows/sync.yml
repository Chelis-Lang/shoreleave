name: weekly sync
# Re-fetches every upstream source, regenerates the package, and opens or updates
# a pull request when any calendar's entries changed. A source that fails to fetch
# or parse (a changed page layout, an unknown holiday name, a Tentative entry)
# fails the run and opens or updates an issue.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-sync
  cancel-in-progress: false

env:
  CHELIS_TAG: v0.18.13
  CHELIS_VERSION: 0.18.13
  FAILURE_TITLE: "Weekly sync failed"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      # Chelis-Lang/chelis is private: CHELIS_RELEASE_TOKEN only installs the
      # toolchain. The pull request and the issue use the default token.
      - name: Bootstrap chelisup
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$CHELIS_TAG" --repo Chelis-Lang/chelis --pattern chelisup.sh --output - | sh
          echo "$HOME/.chelis/bin" >> "$GITHUB_PATH"
      - name: Install chelis toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelisup install 0.18.13
      - name: Fetch every source
        working-directory: sync
        run: |
          set -euo pipefail
          uv run --frozen --python 3.11 python -m shoreleave_sync fetch 2>&1 | tee "$RUNNER_TEMP/fetch.log"
      - name: Regenerate
        working-directory: sync
        run: uv run --frozen --python 3.11 python -m shoreleave_sync generate
      - name: Detect changed calendars
        id: changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- upstream src)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # New data can legitimately break tests that pin a horizon or a count; the
      # outcome goes into the pull request rather than blocking it.
      - name: Test the regenerated package
        id: tests
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            chelis test tests/
            chelis test tests_neg/ --expect neg
            (cd sync && uv run --frozen --python 3.11 pytest -q)
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Write the pull-request body
        if: steps.changes.outputs.changed == 'true'
        env:
          TESTS: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          (cd sync && uv run --frozen --python 3.11 python -m shoreleave_sync pr-body --output "$RUNNER_TEMP/body.md")
          {
            echo
            echo "### Tests on the regenerated package: ${TESTS}"
            echo
            echo "A pull request opened with the default token does not start CI; this run's"
            echo "test log is at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo "Close and reopen the pull request to run CI on it."
          } >> "$RUNNER_TEMP/body.md"
      - name: Open or update the sync pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: sync/weekly
          delete-branch: true
          add-paths: |
            upstream/**
            src/**
          commit-message: "data: sync upstream holiday sources"
          title: "data: sync upstream holiday sources"
          body-path: ${{ runner.temp }}/body.md
      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "The weekly sync failed: ${run_url}"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/fetch.log" ]; then grep -E '^FAILED ' "$RUNNER_TEMP/fetch.log" || tail -n 40 "$RUNNER_TEMP/fetch.log"; else echo "the run failed before fetching"; fi
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${FAILURE_TITLE}\" in:title" --json number,title --jq "map(select(.title == \"${FAILURE_TITLE}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$FAILURE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
